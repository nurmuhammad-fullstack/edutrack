<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EduTrack — O'qituvchi paneli</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../shared/css/tokens.css">
  <link rel="stylesheet" href="css/trainer.css">
</head>
<body>

<div class="layout">

  <!-- TOP HEADER -->
  <header class="head">
    <div class="head-brand">
      <div class="head-brand-logo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c0 2 4 3 6 3s6-1 6-3v-5"/>
        </svg>
      </div>
      EduTrack
    </div>
    <div class="head-actions">
      <button class="icon-btn" title="Bildirishnomalar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="bell-dot"></span>
      </button>
      <div class="me-av">SA</div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">

    <!-- ===== ARIZALAR SAHIFASI ===== -->
    <section id="page-pending">
      <div style="margin-bottom:16px">
        <div class="page-title">Yangi arizalar</div>
        <div class="page-sub">Ro'yxatdan o'tgan o'quvchilarni tasdiqlang</div>
      </div>

      <!-- Stat row -->
      <div class="stat-row" style="margin-bottom:20px">
        <div class="stat-card dark">
          <div class="stat-label">Jami</div>
          <div class="stat-value" id="stat-total">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label"><span class="dot green"></span>Faol</div>
          <div class="stat-value" id="stat-active">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label"><span class="dot orange"></span>Pending</div>
          <div class="stat-value" id="stat-pending">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label"><span class="dot red"></span>To'lamagan</div>
          <div class="stat-value" id="stat-unpaid">—</div>
        </div>
      </div>

      <!-- Pending cards -->
      <div class="panel">
        <div class="panel-head">
          <h2>Kutilayotgan <span class="pill" id="pending-pill">0</span></h2>
          <div class="tabs">
            <button class="tab active">Hammasi</button>
            <button class="tab">Bugun</button>
          </div>
        </div>
        <div class="pending-grid" id="pending-grid"></div>
        <div class="empty" id="pending-empty" hidden>Hozircha yangi arizalar yo'q.</div>
      </div>
    </section>

    <!-- ===== O'QUVCHILAR SAHIFASI ===== -->
    <section id="page-students" hidden>
      <div style="margin-bottom:16px">
        <div class="page-title">Faol o'quvchilar</div>
        <div class="page-sub">Barcha tasdiqlangan o'quvchilar</div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div class="tabs" id="group-tabs">
            <button class="tab active" data-group="all">Hammasi</button>
          </div>
        </div>
        <div class="students-list" id="students-list"></div>
        <div class="empty" id="students-empty" hidden>Faol o'quvchilar yo'q.</div>
      </div>
    </section>

  </main>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">
    <div class="bn-item active" data-page="pending">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 11h-6M19 8v6"/></svg>
      <span>Arizalar</span>
      <span class="bn-badge" id="nav-count" style="display:none">0</span>
    </div>
    <div class="bn-item" data-page="students">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>O'quvchilar</span>
    </div>
  </nav>

</div>

<div class="toast" id="toast">
  <div class="toast-icon">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  </div>
  <span id="toast-text"></span>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
